<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>OVD &mdash; SUPPORT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #050505;
  --surface: #0e0e0e;
  --card: #141414;
  --card-hover: #1a1a1a;
  --border: #1f1f1f;
  --border-accent: #2a2a2a;
  --text: #e5e5e5;
  --text-dim: #737373;
  --text-muted: #525252;
  --white: #ffffff;
  --green: #22c55e;
  --green-glow: rgba(34, 197, 94, 0.15);
  --green-dim: rgba(34, 197, 94, 0.08);
  --blue: #3b82f6;
  --blue-glow: rgba(59, 130, 246, 0.15);
  --purple: #a855f7;
  --purple-glow: rgba(168, 85, 247, 0.15);
  --amber: #f59e0b;
  --amber-glow: rgba(245, 158, 11, 0.15);
  --red: #ef4444;
  --red-glow: rgba(239, 68, 68, 0.15);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}

/* PASSWORD GATE */
.pw-gate {
  position: fixed; inset: 0; z-index: 99999;
  background: #050505;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 28px;
  transition: opacity 0.5s, visibility 0.5s;
}
.pw-gate.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.pw-logo {
  width: 120px; height: 120px;
  margin-bottom: 8px;
}
.pw-logo img {
  width: 100%; height: 100%;
  object-fit: contain;
  filter: invert(1);
}
.pw-title {
  font-family: "Playfair Display", serif;
  font-size: 14px; font-weight: 500;
  letter-spacing: 6px; color: rgba(255,255,255,0.35);
  text-transform: uppercase;
}
.pw-input {
  width: 340px; max-width: 80vw;
  padding: 14px 20px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  color: rgba(255,255,255,0.5);
  font-family: Inter, sans-serif;
  font-size: 15px; text-align: center;
  outline: none;
  transition: border-color 0.3s;
}
.pw-input::placeholder { color: rgba(255,255,255,0.2); }
.pw-input:focus { border-color: rgba(255,255,255,0.25); }
.pw-input.shake {
  animation: pwShake 0.4s ease;
  border-color: rgba(239,68,68,0.5);
}
@keyframes pwShake {
  0%,100% { transform: translateX(0); }
  20%,60% { transform: translateX(-8px); }
  40%,80% { transform: translateX(8px); }
}
.pw-subtitle {
  font-size: 11px; font-weight: 500;
  letter-spacing: 5px; color: rgba(255,255,255,0.15);
  text-transform: uppercase;
}

/* BACKGROUND GRADIENT */
body::before {
  content: '';
  position: fixed;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(ellipse at 30% 20%, rgba(59, 130, 246, 0.03) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 80%, rgba(168, 85, 247, 0.02) 0%, transparent 50%);
  pointer-events: none; z-index: 0;
}

/* LAYOUT */
.container { max-width: 1400px; margin: 0 auto; padding: 32px 24px; position: relative; z-index: 1; }

/* HEADER */
.header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 32px; padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.header-left { display: flex; align-items: center; gap: 16px; }
.header-logo { width: 48px; height: 48px; }
.header-logo img { width: 100%; height: 100%; object-fit: contain; filter: invert(1); }
.header-title {
  font-family: "Playfair Display", serif;
  font-size: 11px; font-weight: 500;
  letter-spacing: 5px; color: var(--text-dim);
  text-transform: uppercase;
}
.header-subtitle {
  font-size: 22px; font-weight: 600; color: var(--white);
  margin-top: 2px;
}
.header-right { display: flex; align-items: center; gap: 12px; }
.live-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.live-text { font-size: 12px; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; }
.last-updated { font-size: 12px; color: var(--text-muted); margin-left: 12px; }

/* STAT CARDS ROW */
.stats-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  transition: all 0.3s;
}
.stat-card:hover {
  background: var(--card-hover);
  border-color: var(--border-accent);
}
.stat-label {
  font-size: 11px; font-weight: 500;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.stat-value {
  font-size: 28px; font-weight: 700;
  color: var(--white);
  line-height: 1;
}
.stat-sub {
  font-size: 12px; color: var(--text-dim);
  margin-top: 6px;
  display: flex; align-items: center; gap: 4px;
}
.stat-sub .up { color: var(--green); }
.stat-sub .down { color: var(--red); }
.stat-accent-green { border-top: 2px solid var(--green); }
.stat-accent-blue { border-top: 2px solid var(--blue); }
.stat-accent-amber { border-top: 2px solid var(--amber); }
.stat-accent-red { border-top: 2px solid var(--red); }
.stat-accent-purple { border-top: 2px solid var(--purple); }

/* MAIN GRID */
.main-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 28px;
}
.main-grid-full {
  grid-column: 1 / -1;
}

/* PANELS */
.panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
}
.panel-title {
  font-size: 13px; font-weight: 600;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--text-dim);
}
.panel-badge {
  font-size: 11px; font-weight: 500;
  padding: 3px 10px; border-radius: 20px;
  background: rgba(255,255,255,0.05);
  color: var(--text-dim);
}
.panel-body { padding: 20px; }

/* EMAIL QUEUE */
.email-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  border-radius: 8px;
  margin-bottom: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  transition: all 0.2s;
  cursor: default;
}
.email-item:hover {
  background: var(--card-hover);
  border-color: var(--border-accent);
}
.email-item:last-child { margin-bottom: 0; }
.email-left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
.email-priority {
  width: 4px; height: 36px; border-radius: 2px;
  flex-shrink: 0;
}
.priority-urgent { background: var(--red); box-shadow: 0 0 8px var(--red-glow); }
.priority-high { background: var(--amber); box-shadow: 0 0 8px var(--amber-glow); }
.priority-normal { background: var(--blue); box-shadow: 0 0 8px var(--blue-glow); }
.priority-low { background: var(--text-muted); }
.email-info { flex: 1; min-width: 0; }
.email-sender {
  font-size: 13px; font-weight: 500; color: var(--white);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.email-subject {
  font-size: 12px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-top: 2px;
}
.email-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.email-tag {
  font-size: 10px; font-weight: 500;
  padding: 3px 8px; border-radius: 4px;
  letter-spacing: 0.5px; text-transform: uppercase;
}
.tag-tracking { background: var(--blue-glow); color: var(--blue); }
.tag-return { background: var(--amber-glow); color: var(--amber); }
.tag-complaint { background: var(--red-glow); color: var(--red); }
.tag-product { background: var(--purple-glow); color: var(--purple); }
.tag-wholesale { background: var(--green-glow); color: var(--green); }
.tag-general { background: rgba(255,255,255,0.05); color: var(--text-dim); }
.email-wait {
  font-size: 11px; color: var(--text-muted);
  white-space: nowrap;
}
.email-wait.overdue { color: var(--red); font-weight: 500; }
.email-wait.warning { color: var(--amber); }

/* ESCALATION FLAG */
.escalation-flag {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; font-weight: 600;
  color: var(--red);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.escalation-flag svg { width: 14px; height: 14px; }

/* CATEGORY BREAKDOWN */
.category-list { display: flex; flex-direction: column; gap: 14px; }
.category-item {
  display: flex; align-items: center; gap: 14px;
}
.category-dot {
  width: 10px; height: 10px; border-radius: 50%;
  flex-shrink: 0;
}
.category-label {
  font-size: 13px; color: var(--text);
  width: 140px; flex-shrink: 0;
}
.category-bar-wrap {
  flex: 1; height: 8px;
  background: rgba(255,255,255,0.04);
  border-radius: 4px;
  overflow: hidden;
}
.category-bar {
  height: 100%; border-radius: 4px;
  transition: width 1s ease;
}
.category-count {
  font-size: 13px; font-weight: 600;
  color: var(--white);
  width: 32px; text-align: right;
}
.category-pct {
  font-size: 11px; color: var(--text-muted);
  width: 36px; text-align: right;
}

/* CHART AREA */
.chart-area {
  position: relative;
  height: 200px;
  display: flex;
  align-items: flex-end;
  gap: 2px;
  padding-top: 20px;
}
.chart-bar-group {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.chart-bar-stack {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  height: 160px;
  position: relative;
}
.chart-bar {
  width: 70%;
  border-radius: 3px 3px 0 0;
  transition: all 0.6s ease;
  min-height: 2px;
}
.chart-label {
  font-size: 10px;
  color: var(--text-muted);
  text-align: center;
}
.chart-value {
  font-size: 10px;
  color: var(--text-dim);
  position: absolute;
  top: 0;
}

/* SATISFACTION GAUGE */
.gauge-container {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  padding: 20px 0;
}
.gauge-ring {
  position: relative;
  width: 160px;
  height: 160px;
}
.gauge-ring svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}
.gauge-ring circle {
  fill: none;
  stroke-width: 8;
}
.gauge-bg { stroke: rgba(255,255,255,0.06); }
.gauge-fill {
  stroke-linecap: round;
  transition: stroke-dashoffset 1.5s ease;
}
.gauge-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.gauge-pct {
  font-size: 36px;
  font-weight: 700;
  color: var(--white);
  line-height: 1;
}
.gauge-label-inner {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 4px;
}
.gauge-breakdown {
  display: flex;
  gap: 24px;
}
.gauge-stat {
  text-align: center;
}
.gauge-stat-value {
  font-size: 18px;
  font-weight: 600;
}
.gauge-stat-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* RESPONSE TIME CHART */
.resp-chart {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  height: 120px;
  padding: 0 4px;
}
.resp-bar-group {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  height: 100%;
  justify-content: flex-end;
}
.resp-bar {
  width: 100%;
  border-radius: 4px 4px 0 0;
  transition: height 0.8s ease;
  position: relative;
}
.resp-bar-label {
  font-size: 10px;
  color: var(--text-muted);
}
.resp-bar-value {
  font-size: 9px;
  color: var(--text-dim);
  position: absolute;
  top: -16px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
}

/* TREND LINE */
.trend-svg {
  width: 100%;
  height: 200px;
}
.trend-line {
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.trend-area {
  opacity: 0.1;
}
.trend-dot {
  transition: all 0.3s;
}
.trend-grid-line {
  stroke: rgba(255,255,255,0.04);
  stroke-width: 1;
}
.trend-label {
  font-size: 10px;
  fill: var(--text-muted);
  font-family: Inter, sans-serif;
}

/* RESPONSIVE */
@media (max-width: 1100px) {
  .stats-row { grid-template-columns: repeat(3, 1fr); }
  .main-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .header { flex-direction: column; align-items: flex-start; gap: 12px; }
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-accent); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ANIMATIONS */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-in {
  animation: fadeIn 0.5s ease forwards;
  opacity: 0;
}
.delay-1 { animation-delay: 0.1s; }
.delay-2 { animation-delay: 0.2s; }
.delay-3 { animation-delay: 0.3s; }
.delay-4 { animation-delay: 0.4s; }
.delay-5 { animation-delay: 0.5s; }

.range-bar { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.range-pill { background: none; border: 1px solid var(--border-accent); color: var(--text-muted); font-family: inherit; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; padding: 8px 16px; border-radius: 980px; cursor: pointer; transition: all 0.2s; }
.range-pill:hover { color: var(--text); }
.range-pill.active { background: var(--text); color: var(--bg); border-color: transparent; }
.email-item { cursor: pointer; }


/* ===== OVD MONOCHROME PASS (matches whathappenedtogod.dev) ===== */
:root { --a-line: rgba(255,255,255,0.09); --a-line-hi: rgba(255,255,255,0.2); --a-card: rgba(255,255,255,0.03);
        --a-tx: rgba(255,255,255,0.92); --a-tx2: rgba(255,255,255,0.55); --a-tx3: rgba(255,255,255,0.35); }
body { background:#0a0a0a !important; color:var(--a-tx) !important;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif !important; }

.header { border-bottom:1px solid var(--a-line) !important; padding-bottom:16px !important; margin-bottom:24px !important; }
.header-title { font-size:22px !important; font-weight:700 !important; letter-spacing:-0.6px !important; color:var(--a-tx) !important; }
.header-subtitle { font-size:9px !important; letter-spacing:2.5px !important; text-transform:uppercase !important; color:var(--a-tx3) !important; }
.header-logo { width:34px !important; height:34px !important; }

/* KPI strip — one hairline card, no colour bars */
.stats-row { gap:0 !important; border:1px solid var(--a-line) !important; border-radius:14px; overflow:hidden;
  background:var(--a-card); margin-bottom:22px !important; }
.stat-card { background:none !important; border:none !important; border-left:1px solid var(--a-line) !important;
  border-radius:0 !important; padding:17px 19px !important; }
.stat-card:first-child { border-left:none !important; }
.stat-card:hover { background:rgba(255,255,255,0.02) !important; }
.stat-accent-green, .stat-accent-blue, .stat-accent-amber, .stat-accent-red, .stat-accent-purple { border-top:none !important; }
.stat-label { font-size:9px !important; letter-spacing:2px !important; color:var(--a-tx3) !important; margin-bottom:8px !important; font-weight:400 !important; }
.stat-value { font-size:23px !important; font-weight:600 !important; letter-spacing:-0.5px !important;
  color:var(--a-tx) !important; font-variant-numeric:tabular-nums; }
.stat-sub { font-size:10px !important; color:var(--a-tx3) !important; margin-top:6px !important; }

/* panels */
.panel { background:var(--a-card) !important; border:1px solid var(--a-line) !important; border-radius:16px !important; }
.panel-header { padding:18px 20px !important; border-bottom:1px solid var(--a-line) !important; }
.panel-title { font-size:10px !important; letter-spacing:2.5px !important; color:var(--a-tx3) !important; font-weight:500 !important; }
.panel-badge { background:none !important; border:1px solid var(--a-line) !important; color:var(--a-tx3) !important;
  font-size:9px !important; letter-spacing:1.5px !important; text-transform:uppercase !important; padding:4px 11px !important; }

/* range pills match the hub's filter pills */
.range-pill { border:1px solid var(--a-line) !important; color:var(--a-tx2) !important; font-size:10px !important;
  letter-spacing:1.5px !important; padding:9px 16px !important; }
.range-pill:hover { color:var(--a-tx) !important; border-color:var(--a-line-hi) !important; }
.range-pill.active { background:rgba(255,255,255,0.92) !important; color:#0a0a0a !important; border-color:transparent !important; font-weight:600 !important; }

.email-item { border-color:var(--a-line) !important; }
.email-item:hover { background:rgba(255,255,255,0.02) !important; }


/* colour is reserved for urgency and money — everything else goes monochrome */
.email-item { background:var(--a-card) !important; border:1px solid var(--a-line) !important; border-radius:12px !important;
  padding:14px 16px !important; margin-bottom:8px !important; }
.email-priority { width:5px !important; height:5px !important; border-radius:50% !important; box-shadow:none !important; }
.priority-urgent { background:#ff453a !important; }
.priority-high  { background:var(--a-tx2) !important; }
.priority-normal, .priority-low { background:var(--a-tx3) !important; }
.email-tag { background:none !important; border:1px solid var(--a-line) !important; color:var(--a-tx3) !important;
  font-size:8.5px !important; letter-spacing:1.4px !important; text-transform:uppercase !important;
  padding:3px 9px !important; border-radius:980px !important; font-weight:400 !important; }
.email-tag.tag-complaint { color:#ff453a !important; border-color:rgba(255,69,58,0.35) !important; }
.category-dot { width:6px !important; height:6px !important; background:var(--a-tx3) !important; box-shadow:none !important; }
.category-bar-wrap { background:rgba(255,255,255,0.06) !important; height:4px !important; border-radius:980px !important; }
.category-bar { background:var(--a-tx2) !important; border-radius:980px !important; }
.category-item:first-child .category-bar { background:var(--a-tx) !important; }
.category-label { font-size:12px !important; color:var(--a-tx2) !important; }
.category-count { font-size:13px !important; color:var(--a-tx) !important; font-variant-numeric:tabular-nums; }
.category-pct { font-size:10px !important; color:var(--a-tx3) !important; }
.live-dot { background:#30d158 !important; box-shadow:none !important; }


/* ===== OVD LIQUID GLASS ===== */
:root { --g-blur: saturate(150%) blur(22px);
        --g-fill: rgba(255,255,255,0.045); --g-fill-hi: rgba(255,255,255,0.075);
        --g-edge: rgba(255,255,255,0.10); --g-edge-hi: rgba(255,255,255,0.20);
        --g-sheen: inset 0 1px 0 rgba(255,255,255,0.08); }

html, body { font-family: "Helvetica Neue", Helvetica, "Helvetica Neue LT Std", Arial, sans-serif !important;
  -webkit-font-smoothing: antialiased; }
body { background: #060606 !important; }
/* ambient light so the glass has something to refract */
body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 520px at 12% -8%, rgba(255,255,255,0.055), transparent 60%),
    radial-gradient(760px 460px at 92% 4%, rgba(255,255,255,0.035), transparent 62%),
    radial-gradient(1000px 620px at 50% 108%, rgba(255,255,255,0.028), transparent 60%); }
.container, .app { position: relative; z-index: 1; }

/* every panel is a single glass pane */
.stats-row, .panel, .card, .home-section-card, .quick-link, .modal, .email-item {
  background: var(--g-fill) !important;
  -webkit-backdrop-filter: var(--g-blur); backdrop-filter: var(--g-blur);
  border: 1px solid var(--g-edge) !important;
  box-shadow: var(--g-sheen), 0 10px 34px rgba(0,0,0,0.42) !important;
}

function renderRangeBar(){
  document.getElementById('rangeBar').innerHTML = RANGES.map(r =>
    '<button class="range-pill' + (r[0] === range ? ' active' : '') + '" data-r="' + r[0] + '">' + r[1] + '</button>').join('');
  document.querySelectorAll('.range-pill').forEach(b => b.onclick = () => {
    range = b.dataset.r;
    localStorage.setItem('ovd_support_range', range);
    renderRangeBar();
    loadData();
  });
}

async function loadData(){
  document.getElementById('lastUpdated').textContent = 'loading…';
  try {
    const j = await (await authedFetch(API + '?range=' + range)).json();
    if (j.error) throw new Error(j.error);
    const c = j.counts;
    document.getElementById('statAwaiting').textContent = c.awaiting;
    document.getElementById('statAwaitingSub').textContent = c.overdue ? c.overdue + ' overdue' : 'all fresh';
    document.getElementById('statOverdue').textContent = c.overdue;
    document.getElementById('statAvgResp').textContent = j.avgResponseH != null ? j.avgResponseH + 'h' : '—';
    document.getElementById('statReceived').textContent = c.received;
    document.getElementById('statSent').textContent = c.sent;
    document.getElementById('statRangeLabel').textContent = rangeLabel().toLowerCase();
    document.getElementById('statRangeLabel2').textContent = rangeLabel().toLowerCase();
    document.getElementById('queueCount').textContent = c.awaiting + ' awaiting';
    document.getElementById('catRangeBadge').textContent = rangeLabel();

    const qEl = document.getElementById('emailQueue');
    if (!j.queue.length) {
      qEl.innerHTML = '<div style="padding:36px;text-align:center;color:var(--text-muted);font-size:13px">inbox clear — nothing awaiting a reply</div>';
    } else {
      qEl.innerHTML = j.queue.map(em => {
        const meta = CAT_META[em.category] || CAT_META.other;
        const pri = em.ageH > 96 ? 'priority-urgent' : em.overdue ? 'priority-high' : 'priority-normal';
        return '<div class="email-item" onclick="window.open(\'https://mail.google.com/mail/u/0/#inbox/' + em.threadId + '\', \'_blank\')">' +
          '<div class="email-left"><div class="email-priority ' + pri + '"></div>' +
          '<div class="email-info"><div class="email-sender">' + escT(em.from) + '</div>' +
          '<div class="email-subject">' + escT(em.subject) + '</div></div></div>' +
          '<div class="email-right">' +
          (em.overdue ? '<div class="escalation-flag">' + WARN_SVG + 'OVERDUE</div>' : '') +
          '<span class="email-tag ' + meta.tag + '">' + meta.tagLabel + '</span>' +
          '<span class="email-wait' + (em.overdue ? ' warning' : '') + '">' + fmtAge(em.ageH) + '</span></div></div>';
      }).join('');
    }

    const total = Object.values(j.categories).reduce((s, x) => s + x, 0) || 1;
    document.getElementById('categoryList').innerHTML = Object.entries(j.categories).sort((a, b) => b[1] - a[1]).map((pair, ix) => {
      const m = CAT_META[pair[0]] || CAT_META.other;
      const pct = Math.round(pair[1] / total * 100);
      // monochrome ramp — biggest category is brightest, no rainbow
      const tone = 'rgba(255,255,255,' + Math.max(0.18, 0.85 - ix * 0.13).toFixed(2) + ')';
      return '<div class="category-item" style="display:flex;align-items:center;gap:14px;padding:11px 0">' +
        '<div class="category-dot" style="width:6px;height:6px;border-radius:50%;background:' + tone + '"></div>' +
        '<div class="category-label" style="flex:0 0 160px">' + m.label + '</div>' +
        '<div style="flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:980px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:' + tone + ';border-radius:980px"></div></div>' +
        '<div style="font-weight:600;min-width:24px;text-align:right;font-variant-numeric:tabular-nums">' + pair[1] + '</div>' +
        '<div style="color:var(--text-muted);font-size:11px;min-width:36px;text-align:right;font-variant-numeric:tabular-nums">' + pct + '%</div></div>';
    }).join('');

    document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  } catch(e) {
    document.getElementById('lastUpdated').textContent = 'offline — ' + e.message;
  }
}
renderRangeBar();
loadData();
setInterval(loadData, 300000);
</script>
<script>
// OVD OS single sign-on: when embedded in whathappenedtogod.dev, inherit its session
(function(){
  if (window.parent === window) return;
  var OK = ['https://whathappenedtogod.dev', 'http://localhost:8899'];
  window.addEventListener('message', async function(ev){
    if (OK.indexOf(ev.origin) === -1) return;
    var d = ev.data;
    if (!d || d.type !== 'ovd-os-auth' || !d.access_token) return;   // the hub hands over its real session; a bare string opens nothing
    try { await sbAuth.auth.setSession({ access_token: d.access_token, refresh_token: d.refresh_token }); } catch (e) {}
    openWith({ access_token: d.access_token });
  });
  window.parent.postMessage('ovd-os-ready', '*');
})();
</script>
